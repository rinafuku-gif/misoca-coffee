<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- 相対パス（config.yml 等）の解決基準を /cms/ に固定する。
         これにより /cms でも /cms/ でもトレイリングスラッシュに関わらず正しく動作する。 -->
    <base href="/cms/" />
    <title>三十日珈琲 コンテンツ管理 | 制作：株式会社S.E.ネットワーク</title>
    <style>
      /* Decap CMSのデフォルトロゴ・配色を三十日珈琲ブランドに寄せる最小限のカスタムCSS。
         過剰なテーマ改造はせず、ログイン画面の見出しと隅の制作クレジットのみ調整する。 */
      #nc-root {
        min-height: 100vh;
      }
      .misoca-cms-credit {
        position: fixed;
        right: 12px;
        bottom: 10px;
        z-index: 50;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", sans-serif;
        font-size: 11px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 999px;
        padding: 5px 12px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        pointer-events: none;
      }
      .misoca-cms-credit a {
        pointer-events: auto;
        color: #6b6b6b;
        text-decoration: none;
      }
      .misoca-cms-credit a:hover {
        text-decoration: underline;
      }

      /* ============================================================
         三十日珈琲 CMS — スマホ最適化 & ログイン画面ブランディング
         Decap CMS の管理画面をスマホで見やすくする（PC表示は非変更）。
         ログインロゴのサイズ調整は全幅共通で適用。
         Decap はハッシュ付きクラス名のため [class*="..."] 部分一致で安定的に狙う。
         ============================================================ */

      /* --- ログイン画面: ブランドロゴのサイズ・中央寄せ（全幅共通） ---
         Decap は logo_url をログイン画面で 300x200 / object-fit:fill に強制するため、
         正方形ロゴ(512:512)がそのままだと歪む。natural比を保って小さめに収める。 */
      [class*="CustomIconWrapper"] {
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
        width: auto !important;
        height: auto !important;
        min-height: 0 !important;
      }
      [class*="CustomIconWrapper"] img,
      [class*="StyledAuthenticationPage"] img[alt="Logo"] {
        width: auto !important;
        height: auto !important;
        max-width: 140px !important;
        max-height: 140px !important;
        object-fit: contain !important;
        display: block !important;
        margin: 0 auto 8px !important;
      }

      /* Decap がログイン画面下部に描画する Netlify/Decap クレジットバッジ
         （別サービスの見た目になる要素）を非表示にする。バンドル固定要素のため
         config.yml では消せず、CSSで隠す。 */
      [class*="NetlifyCreditIcon"] {
        display: none !important;
      }

      /* --- スマホ幅（〜799px）: 編集画面のレスポンシブ最適化 --- */
      @media (max-width: 799px) {
        html,
        body {
          max-width: 100% !important;
          overflow-x: hidden !important;
        }
        #nc-root {
          max-width: 100% !important;
        }

        /* 横スクロールの元凶: EditorContainer の min-width:800px + position:absolute */
        [class*="EditorContainer"] {
          min-width: 0 !important;
          width: 100% !important;
          max-width: 100% !important;
          left: 0 !important;
          right: 0 !important;
        }
        [class*="ToolbarContainer"] {
          min-width: 0 !important;
          width: 100% !important;
          max-width: 100% !important;
          padding: 0 8px !important;
          box-sizing: border-box !important;
        }
        div[class*="-Editor"]:not([class*="Container"]):not([class*="Toggle"]) {
          min-width: 0 !important;
          width: 100% !important;
          max-width: 100% !important;
        }

        /* 編集ペインを全幅に、ライブプレビュー(右ペイン)はスマホでは非表示 */
        .SplitPane {
          position: static !important;
          min-width: 0 !important;
          width: 100% !important;
          max-width: 100% !important;
        }
        .SplitPane .Pane1 {
          width: 100% !important;
          max-width: 100% !important;
          min-width: 0 !important;
        }
        .SplitPane .Pane2,
        .SplitPane .Resizer {
          display: none !important;
        }
        [class*="ControlPaneContainer"] {
          min-width: 0 !important;
          width: 100% !important;
          max-width: 100% !important;
          box-sizing: border-box !important;
          padding-bottom: 56px !important;
        }
        /* プレビュー非表示に伴い、プレビュー/スクロール同期の丸トグルは無効化されるため隠す */
        [class*="EditorToggle"] {
          display: none !important;
        }

        /* トップバー: 1行に収め、タイトルの縦積み(1文字ずつ折返し)を解消 */
        [class*="ToolbarSectionBackLink"] {
          flex: 1 1 auto !important;
          min-width: 0 !important;
          overflow: hidden !important;
        }
        [class*="ToolbarSectionBackLink"] a {
          min-width: 0 !important;
          overflow: hidden !important;
        }
        [class*="ToolbarSectionBackLink"] a div {
          min-width: 0 !important;
          max-width: 100% !important;
          white-space: nowrap !important;
          overflow: hidden !important;
          text-overflow: ellipsis !important;
        }
        [class*="ToolbarSectionMain"],
        [class*="ToolbarSectionMeta"] {
          flex: 0 0 auto !important;
        }
        /* スマホでは冗長な導線(ライブで見る・サイトURLリンク)を隠し、公開ボタン+アカウントを優先 */
        [class*="PreviewButtonContainer"],
        [class*="AppHeaderSiteLink"] {
          display: none !important;
        }
        /* タップ領域 44px 以上 */
        [class*="ToolbarContainer"] button,
        [class*="ToolbarContainer"] a[class*="Button"] {
          min-height: 44px !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- 日本語ロケール登録のため、decap-cms.js の自動初期化(CMS.init())を一旦止める。
         理由: decap-cms(オールインワンバンドル)のエントリは既定で "en" ロケールのみを
         CMS.registerLocale('en', en) で登録しており、config.yml の locale: 'ja' を
         指定しただけでは "ja" が未登録のため自動的に en へフォールバックしてしまう
         （decaporg/decap-cms の packages/decap-cms/src/index.js 参照）。
         このフラグを立てておくと自動初期化がスキップされ、下の module script で
         明示的に ja ロケールを登録してから CMS.init() を呼べるようになる。 -->
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>

    <!-- Decap CMSの本体。config.ymlは <base href> により /cms/config.yml から読み込まれる。
         バージョンは範囲指定(^3.0.0)ではなく実バージョンに固定し、SRI(Subresource Integrity)で
         配信元(unpkg.com)からの改ざん・差し替えを検知できるようにしている。
         バージョンを上げる場合はSRIハッシュの再計算が必要
         （`curl -sL <URL> | openssl dgst -sha384 -binary | openssl base64 -A`）。 -->
    <script
      src="https://unpkg.com/decap-cms@3.14.1/dist/decap-cms.js"
      integrity="sha384-K+E/B3QG3FJrtRXoyUjME4ilx71pYGyrvAVxYvd/p0zCPuXsc3eoEuSzUW3Ke63V"
      crossorigin="anonymous"
    ></script>

    <!-- decap-cms-locales の日本語辞書(ESM)をCDNから取得して登録し、その後にCMSを初期化する。
         script-src は /cms 配下のCSPで https://unpkg.com のみ許可しているため、同一オリジン
         (unpkg.com)のESMを type="module" の静的importで読み込む。
         バージョンは decap-cms.js 側の慣例に合わせて固定(3.7.0)。この辞書ファイルには
         他モジュールへのimportが無く単一のオブジェクトをexportするのみ(内容確認済み)。
         module script は常にdeferred相当で実行されるため、直前の同期スクリプトである
         decap-cms.js の実行(window.CMS の代入)が先に完了していることが保証される。 -->
    <script type="module">
      import ja from "https://unpkg.com/decap-cms-locales@3.7.0/dist/esm/ja/index.js";
      window.CMS.registerLocale("ja", ja);
      window.CMS.init();
    </script>

    <!-- 制作クレジット（Ryo指定のHTML相当。CMS管理画面側にのみ表示・サイト本体には掲出しない） -->
    <div class="misoca-cms-credit">
      <p style="margin: 0">
        <a href="https://senetwork.co.jp/" target="_blank" rel="noreferrer noopener"
          >制作：株式会社S.E.ネットワーク</a
        >
      </p>
    </div>
  </body>
</html>
