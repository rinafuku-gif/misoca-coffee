              - { label: "サブタイトル", name: subtitle, widget: string }
              - { label: "説明文", name: description, widget: string }
              - { label: "背景画像", name: image, widget: image }

          - label: "コンセプト"
            name: concept
            widget: object
            collapsed: true
            fields:
              - { label: "見出し上テキスト（英字）", name: eyebrow, widget: string }
              - { label: "見出し1行目", name: headingLine1, widget: string }
              - { label: "見出し2行目", name: headingLine2, widget: string }
              - { label: "本文", name: body, widget: text }

          - label: "3つの特徴"
            name: features
            widget: object
            collapsed: true
            fields:
              - { label: "見出し上テキスト（英字）", name: eyebrow, widget: string }
              - { label: "見出し", name: heading, widget: string }
              - label: "特徴（3件）"
                name: items
                widget: list
                fields:
                  - { label: "タイトル", name: title, widget: string }
                  - { label: "説明文", name: text, widget: text }

          - label: "プラン・料金（LINE相談ベースの表示価格）"
            name: plans
            widget: object
            collapsed: true
            fields:
              - { label: "見出し上テキスト（英字）", name: eyebrow, widget: string }
              - { label: "見出し", name: heading, widget: string }
              - { label: "ボタンのラベル", name: ctaLabel, widget: string }
              - { label: "ボタンのリンク先（LINE URL）", name: ctaHref, widget: string }
              - label: "プラン（S/M/L）"
                name: items
                widget: list
                fields:
                  - { label: "ラベル（S/M/L）", name: label, widget: string }
                  - { label: "プラン名", name: name, widget: string }
                  - { label: "価格", name: price, widget: string }
                  - { label: "キャンペーン文言（任意）", name: campaign, widget: string, required: false }
                  - { label: "おすすめ表示にする", name: featured, widget: boolean, required: false, default: false }
                  - { label: "対象人数", name: description, widget: string }
                  - { label: "補足（任意）", name: note, widget: string, required: false }
                  - { label: "含まれるもの", name: includes, widget: list }

          - label: "大規模プラン"
            name: largePlans
            widget: object
            collapsed: true
            fields:
              - { label: "見出し", name: heading, widget: string }
              - label: "プラン（LL/MAX）"
                name: items
                widget: list
                fields:
                  - { label: "プラン名", name: name, widget: string }
                  - { label: "対象人数", name: capacity, widget: string }
                  - { label: "価格", name: price, widget: string }

          - label: "料金欄の補足"
            name: planFootnotes
            widget: list
            field: { label: "補足行", name: line, widget: string }

          - label: "ご注文の流れ"
            name: orderFlow
            widget: object
            collapsed: true
            fields:
              - { label: "見出し上テキスト（英字）", name: eyebrow, widget: string }
              - { label: "見出し", name: heading, widget: string }
              - label: "ステップ（4件）"
                name: steps
                widget: list
                fields:
                  - { label: "番号", name: num, widget: string }
                  - { label: "タイトル", name: title, widget: string }
                  - { label: "説明文", name: text, widget: text }

          - label: "対応エリア"
            name: serviceArea
            widget: object
            collapsed: true
            fields:
              - { label: "見出し上テキスト（英字）", name: eyebrow, widget: string }
              - { label: "見出し", name: heading, widget: string }
              - { label: "エリア一覧", name: areas, widget: list }
              - { label: "補足", name: footnote, widget: string }

          - label: "よくあるご質問"
            name: faq
            widget: object
            collapsed: true
            fields:
              - { label: "見出し上テキスト（英字）", name: eyebrow, widget: string }
              - { label: "見出し", name: heading, widget: string }
              - label: "Q&A（4件）"
                name: items
                widget: list
                fields:
                  - { label: "質問", name: q, widget: string }
                  - { label: "回答", name: a, widget: text }

          - label: "ケータリングのご相談CTA"
            name: cta
            widget: object
            collapsed: true
            fields:
              - { label: "見出し", name: heading, widget: string }
              - { label: "本文1行目", name: bodyLine1, widget: string }
              - { label: "本文2行目", name: bodyLine2, widget: string }
              - { label: "LINEボタンのラベル", name: lineLabel, widget: string }
              - { label: "LINEボタンのリンク先", name: lineHref, widget: string }
              - { label: "電話ボタンのラベル", name: telLabel, widget: string }
              - { label: "電話番号リンク（tel:から始まる）", name: telHref, widget: string }
              - { label: "補足", name: footnote, widget: string }

      # ============================================================ STAND
      - name: "stand"
        label: "コーヒースタンドページ"
        file: "content/pages/stand.json"
        fields:
          - label: "SEO設定"
            name: seo
            widget: object
            collapsed: true
            fields:
              - { label: "ページタイトル", name: title, widget: string }
              - { label: "説明文", name: description, widget: text }

          - label: "ページ上部（ヒーロー）"
            name: hero
            widget: object
            collapsed: true
            fields:
              - { label: "見出し上テキスト（英字）", name: title, widget: string }
