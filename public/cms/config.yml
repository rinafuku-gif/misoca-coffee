# ============================================================================
# 三十日珈琲 公式サイト — Decap CMS 設定 (Phase A)
# 対象: 直書きされていたテキスト・価格表示・画像パスを編集可能にする。
# 対象外: Notion連携コンテンツ（商品・ジャーナル・予約・問い合わせ）、
#         予約金額の計算定数（pricing.ts / group-reservation-constants.ts）。
# ============================================================================

# --- DecapBridge (https://decapbridge.com/) 本番接続 ---
# DecapBridgeダッシュボードが生成した設定をそのまま使用（2026-07-07接続）。
backend:
  name: git-gateway
  repo: rinafuku-gif/misoca-coffee
  branch: main
  identity_url: https://auth.decapbridge.com/sites/f5ac45d0-3858-42dc-9912-18a5e7664d7b
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: 'Create {{collection}} "{{slug}}" – {{author-name}} <{{author-login}}> via DecapBridge'
    update: 'Update {{collection}} "{{slug}}" – {{author-name}} <{{author-login}}> via DecapBridge'
    delete: 'Delete {{collection}} "{{slug}}" – {{author-name}} <{{author-login}}> via DecapBridge'
    uploadMedia: 'Upload "{{path}}" – {{author-name}} <{{author-login}}> via DecapBridge'
    deleteMedia: 'Delete "{{path}}" – {{author-name}} <{{author-login}}> via DecapBridge'
    openAuthoring: 'Message {{message}} – {{author-name}} <{{author-login}}> via DecapBridge'
  # ログイン画面のロゴを三十日珈琲ブランドに差し替え（Decapロゴを表示しない）
  logo_url: https://misoca-coffee.vercel.app/images/logo-circle-green-cms.png
  site_url: https://misoca-coffee.vercel.app

site_url: https://misoca-coffee.vercel.app
display_url: https://misoca-coffee.vercel.app
# ログイン画面のロゴ（Identity画面用）も三十日珈琲ブランドに統一
logo_url: https://misoca-coffee.vercel.app/images/logo-circle-green-cms.png

# 管理画面（ログイン画面除く）を日本語化する。
# 反映には public/cms/index.html 側で decap-cms-locales の "ja" を
# CMS.registerLocale() で明示登録する対応が必要（後述コメント参照）。
# 未登録のロケールを指定した場合は自動でenへフォールバックする仕様のため。
locale: "ja"

media_folder: "public/images"
public_folder: "/images"
# 既存画像は public/images/about, /experience, /catering など複数のサブフォルダに
# 分かれているため、メディアライブラリの一覧に出ない場合がある。
# その場合は画像フィールドの「URLを挿入」から /images/xxx/yyy.jpg のパスを直接入力すれば
# 既存画像をそのまま参照できる。新規アップロードは public/images/ 直下に保存される。
# （Phase Bのビジュアル編集で、ページごとのサブフォルダ選択UIに改善予定）

collections:
  - name: "pages"
    label: "サイトページ"
    files:
      # ============================================================ HOME
      - name: "home"
        label: "トップページ"
        file: "content/pages/home.json"
        fields:
          - label: "ヒーロー（スライドショー）"
            name: hero
            widget: object
            collapsed: true
            fields:
              - { label: "見出し1行目", name: headingLine1, widget: string }
              - { label: "見出し2行目", name: headingLine2, widget: string }
              - { label: "サブテキスト1行目", name: subtitleLine1, widget: string }
              - { label: "サブテキスト2行目", name: subtitleLine2, widget: string }
              - { label: "メインボタンのラベル", name: primaryCtaLabel, widget: string }
              - label: "メインボタンのリンク先"
                name: primaryCtaHref
                widget: select
                options:
                  - { label: "トップ", value: "/" }
                  - { label: "焙煎体験", value: "/experience" }
                  - { label: "ケータリング", value: "/catering" }
                  - { label: "コーヒースタンド", value: "/stand" }
                  - { label: "三十日珈琲について", value: "/about" }
                  - { label: "アクセス", value: "/access" }
                  - { label: "FAQ", value: "/faq" }
                  - { label: "出張焙煎体験", value: "/mobile-roasting" }
                  - { label: "オンラインショップ", value: "/shop" }
                  - { label: "ジャーナル一覧", value: "/blog" }
                  - { label: "お問い合わせ", value: "/contact" }
              - { label: "サブボタンのラベル", name: secondaryCtaLabel, widget: string }
              - label: "サブボタンのリンク先"
                name: secondaryCtaHref
                widget: select
                options:
                  - { label: "トップ", value: "/" }
                  - { label: "焙煎体験", value: "/experience" }
                  - { label: "ケータリング", value: "/catering" }
                  - { label: "コーヒースタンド", value: "/stand" }
                  - { label: "三十日珈琲について", value: "/about" }
                  - { label: "アクセス", value: "/access" }
                  - { label: "FAQ", value: "/faq" }
                  - { label: "出張焙煎体験", value: "/mobile-roasting" }
                  - { label: "オンラインショップ", value: "/shop" }
                  - { label: "ジャーナル一覧", value: "/blog" }
                  - { label: "お問い合わせ", value: "/contact" }
              - label: "スライド画像（6枚）"
                name: slides
                widget: list
                fields:
                  - { label: "画像", name: src, widget: image }
                  - { label: "代替テキスト（画像の説明）", name: alt, widget: string }

          - label: "Our Story セクション"
            name: ourStory
            widget: object
            collapsed: true
            fields:
              - { label: "見出し上テキスト（英字）", name: eyebrow, widget: string }
              - { label: "見出し", name: heading, widget: string }
              - label: "ブロック1（古民家について）"
                name: block1
                widget: object
                fields:
                  - { label: "画像", name: image, widget: image }
                  - { label: "画像の代替テキスト", name: imageAlt, widget: string }
                  - { label: "タイトル", name: title, widget: string }
                  - label: "本文（段落ごと）"
                    name: paragraphs
                    widget: list
                    field: { label: "段落", name: paragraph, widget: text }
              - label: "ブロック2（三十日珈琲の想い）"
                name: block2
                widget: object
                fields:
                  - { label: "画像", name: image, widget: image }
                  - { label: "画像の代替テキスト", name: imageAlt, widget: string }
                  - { label: "タイトル", name: title, widget: string }
                  - label: "本文（段落ごと）"
                    name: paragraphs
                    widget: list
                    field: { label: "段落", name: paragraph, widget: text }
                  - { label: "ボタンのラベル", name: ctaLabel, widget: string }
                  - label: "ボタンのリンク先"
                    name: ctaHref
                    widget: select
                    options:
                      - { label: "トップ", value: "/" }
                      - { label: "焙煎体験", value: "/experience" }
                      - { label: "ケータリング", value: "/catering" }
                      - { label: "コーヒースタンド", value: "/stand" }
                      - { label: "三十日珈琲について", value: "/about" }
                      - { label: "アクセス", value: "/access" }
                      - { label: "FAQ", value: "/faq" }
                      - { label: "出張焙煎体験", value: "/mobile-roasting" }
                      - { label: "オンラインショップ", value: "/shop" }
                      - { label: "ジャーナル一覧", value: "/blog" }
                      - { label: "お問い合わせ", value: "/contact" }

          - label: "ブランドステートメント（帯テキスト）"
            name: brandStatement
            widget: object
            collapsed: true
            fields:
              - { label: "1行目", name: line1, widget: string }
              - { label: "2行目", name: line2, widget: string }

          - label: "Services セクション（3つの体験）"
            name: services
            widget: object
            collapsed: true
            fields:
              - { label: "見出し上テキスト（英字）", name: eyebrow, widget: string }
              - { label: "見出し", name: heading, widget: string }
              - label: "体験カード（3件）"
                name: items
                widget: list
                fields:
                  - { label: "タイトル", name: title, widget: string }
                  - { label: "説明文（改行はそのまま反映されます）", name: text, widget: text }
                  - { label: "画像", name: image, widget: image }
                  - label: "リンク先"
                    name: href
                    widget: select
                    options:
                      - { label: "焙煎体験", value: "/experience" }
                      - { label: "ケータリング", value: "/catering" }
                      - { label: "出張焙煎体験", value: "/mobile-roasting" }
                      - { label: "コーヒースタンド", value: "/stand" }
                      - { label: "三十日珈琲について", value: "/about" }
                  - { label: "ボタンのラベル", name: cta, widget: string }

          - label: "New Arrival セクション"
            name: newArrival
            widget: object
            collapsed: true
            fields:
              - { label: "見出し上テキスト（英字）", name: eyebrow, widget: string }
              - { label: "画像", name: image, widget: image }
              - { label: "画像の代替テキスト", name: imageAlt, widget: string }
              - { label: "見出し", name: heading, widget: string }
              - { label: "本文", name: body, widget: text }
              - { label: "ボタンのラベル", name: ctaLabel, widget: string }
              - { label: "ボタンのリンク先（商品ページURL）", name: ctaHref, widget: string }

          - label: "Experience CTA セクション（大きな写真の帯）"
            name: experienceCta
            widget: object
            collapsed: true
            fields:
              - { label: "画像", name: image, widget: image }
              - { label: "画像の代替テキスト", name: imageAlt, widget: string }
              - { label: "本文1行目", name: bodyLine1, widget: string }
              - { label: "本文2行目", name: bodyLine2, widget: string }
              - { label: "ボタンのラベル", name: ctaLabel, widget: string }
              - label: "ボタンのリンク先"
                name: ctaHref
                widget: select
                options:
                  - { label: "焙煎体験", value: "/experience" }
                  - { label: "ケータリング", value: "/catering" }
                  - { label: "出張焙煎体験", value: "/mobile-roasting" }

          - label: "Gallery セクション"
            name: gallery
            widget: object
            collapsed: true
            fields:
              - { label: "見出し上テキスト（英字）", name: eyebrow, widget: string }
              - { label: "見出し", name: heading, widget: string }
              - label: "写真（6枚）"
                name: images
                widget: list
                fields:
                  - { label: "画像", name: src, widget: image }
                  - { label: "代替テキスト（画像の説明）", name: alt, widget: string }

          - label: "Online Shop セクション（見出しのみ・商品はNotion連携）"
            name: onlineShop
            widget: object
            collapsed: true
            fields:
              - { label: "見出し上テキスト（英字）", name: eyebrow, widget: string }
              - { label: "見出し", name: heading, widget: string }
              - { label: "ボタンのラベル", name: ctaLabel, widget: string }
              - { label: "ボタンのリンク先", name: ctaHref, widget: string }

          - label: "Journal セクション（見出しのみ・記事はNotion連携）"
            name: journal
            widget: object
            collapsed: true
            fields:
              - { label: "見出し上テキスト（英字）", name: eyebrow, widget: string }
              - { label: "見出し", name: heading, widget: string }
              - { label: "ボタンのラベル", name: ctaLabel, widget: string }
              - { label: "ボタンのリンク先", name: ctaHref, widget: string }

          - label: "Instagram セクション"
            name: instagram
            widget: object
            collapsed: true
            fields:
              - { label: "本文1行目", name: bodyLine1, widget: string }
              - { label: "本文2行目", name: bodyLine2, widget: string }
              - { label: "表示するアカウント名", name: handle, widget: string }
              - { label: "リンク先URL", name: href, widget: string }

      # ====================================================== EXPERIENCE
      - name: "experience"
        label: "焙煎体験ページ"
        file: "content/pages/experience.json"
        fields:
          - label: "SEO設定（検索結果に表示される情報）"
            name: seo
            widget: object
            collapsed: true
            fields:
              - { label: "ページタイトル", name: title, widget: string }
              - { label: "説明文", name: description, widget: text }

          - label: "ページ上部（ヒーロー）"
            name: hero
            widget: object
            collapsed: true
            fields:
              - { label: "見出し上テキスト（英字）", name: title, widget: string }
              - { label: "サブタイトル", name: subtitle, widget: string }
              - { label: "説明文", name: description, widget: string }
              - { label: "背景画像", name: image, widget: image }

          - label: "直予約バナー"
            name: directBookingBanner
            widget: object
            collapsed: true
            fields:
              - { label: "テキスト", name: text, widget: string }

          - label: "プラン・料金"
            name: pricing
            widget: object
            collapsed: true
            fields:
              - { label: "見出し上テキスト（英字）", name: eyebrow, widget: string }
              - { label: "見出し", name: heading, widget: string }
              - { label: "サブ見出し", name: subheading, widget: string }
              - label: "プライベートプラン（価格はpricing.tsと連動のため編集不可）"
                name: personalPlan
                widget: object
                fields:
                  - { label: "バッジ文言", name: badge, widget: string }
                  - { label: "英字ラベル", name: eyebrow, widget: string }
                  - { label: "プラン名", name: title, widget: string }
                  - { label: "価格の注記", name: priceNote, widget: string }
                  - label: "特徴リスト"
                    name: features
                    widget: list
                  - { label: "ボタンのラベル", name: ctaLabel, widget: string }
              - label: "グループプラン（価格はpricing.tsと連動のため編集不可）"
                name: groupPlan
                widget: object
                fields:
                  - { label: "英字ラベル", name: eyebrow, widget: string }
                  - { label: "プラン名", name: title, widget: string }
                  - { label: "価格の注記", name: priceNote, widget: string }
                  - label: "特徴リスト"
                    name: features
                    widget: list
                  - { label: "ボタンのラベル", name: ctaLabel, widget: string }
              - { label: "補足1（1行目）", name: footnote1Line1, widget: string }
              - label: "補足1（2行目・PCでは1行目と続けて1行表示、スマホのみ改行されます）"
                name: footnote1Line2
                widget: string
              - { label: "補足2", name: footnote2, widget: text }

          - label: "体験の流れ"
            name: flow
            widget: object
            collapsed: true
            fields:
              - { label: "見出し上テキスト（英字）", name: eyebrow, widget: string }
              - { label: "見出し", name: heading, widget: string }
              - { label: "サブ見出し", name: subheading, widget: string }
              - label: "ステップ（5件）"
                name: steps
                widget: list
                fields:
                  - { label: "番号", name: num, widget: string }
                  - { label: "タイトル", name: title, widget: string }
                  - { label: "説明文", name: text, widget: text }
                  - { label: "画像", name: image, widget: image }

          - label: "体験の風景ギャラリー"
            name: gallery
            widget: object
            collapsed: true
            fields:
              - { label: "見出し上テキスト（英字）", name: eyebrow, widget: string }
              - { label: "見出し", name: heading, widget: string }
              - label: "写真（6枚）"
                name: images
                widget: list
                field: { label: "画像", name: image, widget: image }

          - label: "アクセス情報"
            name: access
            widget: object
            collapsed: true
            fields:
              - { label: "見出し上テキスト（英字）", name: eyebrow, widget: string }
              - { label: "見出し", name: heading, widget: string }
              - label: "電車でお越しの方"
                name: trainCard
                widget: object
                fields:
                  - { label: "タイトル", name: title, widget: string }
                  - { label: "項目リスト", name: items, widget: list }
              - label: "お車でお越しの方"
                name: carCard
                widget: object
                fields:
                  - { label: "タイトル", name: title, widget: string }
                  - { label: "項目リスト", name: items, widget: list }

      # ========================================================= CATERING
      - name: "catering"
        label: "ケータリングページ"
        file: "content/pages/catering.json"
        fields:
          - label: "SEO設定"
            name: seo
            widget: object
            collapsed: true
